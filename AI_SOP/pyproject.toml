[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sop"
version = "0.1.0"
description = "Web experience for turning natural-language work descriptions into BoI SOP Wiki drafts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "google-genai>=1.30,<2",
  "itsdangerous>=2.2,<3",
  "langchain-openai>=0.3.33,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymongo>=4.13,<5",
  "pypdf>=5,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
